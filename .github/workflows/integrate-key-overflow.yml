name: Integrate B+ tree 4 KiB keys

on:
  push:
    branches: [feat/btree-key-overflow-common]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/btree-key-overflow-common
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply key overflow integration
        run: python .github/scripts/integrate_key_overflow.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-storage-btree/src/tree.rs crates/db-storage-btree/src/tree/delete.rs crates/db-storage-btree/src/tree/overflow.rs crates/db-storage-btree/src/tree/reuse.rs
          git commit -m "feat(btree): support 4 KiB keys with overflow blobs"
          git push origin HEAD:feat/btree-key-overflow-common
