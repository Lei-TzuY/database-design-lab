name: Integrate B+ tree common contract

on:
  push:
    branches: [feat/btree-key-overflow-common]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/btree-key-overflow-common
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply common-contract integration
        run: python .github/scripts/integrate_common_kv.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/db-core/src/engine.rs crates/db-storage-btree/Cargo.toml crates/db-storage-btree/src/tree.rs crates/db-storage-btree/src/tree/common.rs
          git commit -m "feat(btree): implement common KvEngine contract"
          git push origin HEAD:feat/btree-key-overflow-common
