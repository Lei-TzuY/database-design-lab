name: Validate LSM compaction fault evidence

on:
  push:
    branches: [feat/lsm-compaction-fault-injection]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lsm-compaction-fault-injection
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply evidence documentation
        run: python .github/scripts/update_lsm_compaction_fault_docs.py
      - name: Validate committed tree
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit validated documentation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md crates/db-storage-lsm/src/lib.rs docs/lsm-sstable-manifest-format.md docs/roadmap.md
          git commit -m "docs(lsm): lock compaction fault evidence"
          git push origin HEAD:feat/lsm-compaction-fault-injection
