name: Validate LSM Bloom slice

on:
  push:
    branches: [feat/lsm-bloom-filter]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lsm-bloom-filter
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply Bloom integration and evidence patches
        run: |
          python .github/scripts/apply_lsm_bloom_filter.py
          python .github/scripts/fix_lsm_bloom_round2.py
          python .github/scripts/finalize_lsm_bloom.py
          python .github/scripts/fix_lsm_bloom_evidence_count.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit validated implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add README.md docs/design-space.md docs/lsm-sstable-manifest-format.md docs/lsm-wal-format.md docs/roadmap.md crates/db-storage-lsm/src/bloom.rs crates/db-storage-lsm/src/lib.rs crates/db-storage-lsm/src/sstable.rs crates/db-storage-lsm/src/sstable_tests.rs
          git commit -m "docs(lsm): lock Bloom filter evidence"
          git push origin HEAD:feat/lsm-bloom-filter
