name: Validate LSM amplification docs

on:
  push:
    branches:
      - feat/lsm-amplification-instrumentation
    paths:
      - .github/scripts/update_lsm_amplification_docs.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply documentation patch
        run: python .github/scripts/update_lsm_amplification_docs.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Commit validated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md crates/db-storage-lsm/src/lib.rs docs/lsm-sstable-manifest-format.md docs/roadmap.md docs/design-space.md
          if git diff --cached --quiet; then
            echo "No documentation changes to commit"
          else
            git commit -m "docs(lsm): define amplification evidence"
            git push
          fi
