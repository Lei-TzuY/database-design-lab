name: Validate Phase 4 operational work samples

on:
  push:
    branches:
      - feat/phase4-operational-work-samples
    paths:
      - .github/scripts/update_phase4_operational_work_docs.py
      - .github/workflows/validate-phase4-operational-work-samples.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase4-operational-work-samples
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply documentation update
        run: python .github/scripts/update_phase4_operational_work_docs.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Check MSRV
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked
      - name: Commit validated documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/amplification-methodology.md docs/experiment-traces.md docs/roadmap.md
          if git diff --cached --quiet; then
            echo "No documentation changes to commit"
          else
            git commit -m "docs: define operational work sample methodology"
            git push origin HEAD:feat/phase4-operational-work-samples
          fi
