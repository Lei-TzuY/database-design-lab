name: Validate Phase 4 operational work samples

on:
  push:
    branches:
      - feat/phase4-operational-work-samples
    paths:
      - .github/scripts/harden_phase4_operational_work_compat.py
      - .github/workflows/validate-phase4-operational-work-samples.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase4-operational-work-samples
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply compatibility hardening
        run: python .github/scripts/harden_phase4_operational_work_compat.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Check MSRV
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked
      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-core/src/engine.rs crates/db-core/src/experiment.rs crates/db-storage-btree/src/tree/common.rs crates/db-storage-btree/src/tree/instrumentation_tests.rs crates/db-storage-lsm/src/lib.rs crates/db-storage-lsm/src/instrumentation_tests.rs
          if git diff --cached --quiet; then
            echo "No compatibility changes to commit"
          else
            git commit -m "fix: preserve raw operational timing projections"
            git push origin HEAD:feat/phase4-operational-work-samples
          fi
