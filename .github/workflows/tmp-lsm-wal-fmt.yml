name: Temporary LSM WAL formatting

on:
  push:
    branches:
      - hardening/lsm-wal-prefix-fingerprint
    paths:
      - .github/workflows/tmp-lsm-wal-fmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/lsm-wal-prefix-fingerprint
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          git rm .github/workflows/tmp-lsm-wal-fmt.yml
          git add crates/db-storage-lsm/src/wal.rs crates/db-storage-lsm/tests/live_wal_prefix.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format LSM WAL prefix validation"
          git push origin HEAD:hardening/lsm-wal-prefix-fingerprint
