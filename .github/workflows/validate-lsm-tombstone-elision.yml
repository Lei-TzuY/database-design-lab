name: Validate LSM tombstone elision

on:
  push:
    branches: [feat/lsm-tombstone-elision]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lsm-tombstone-elision
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Add Manifest v4 semantic corruption regressions
        run: python .github/scripts/add_lsm_v4_semantic_corruption_tests.py
      - name: Validate committed v4 tree
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit validated semantic regressions
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-storage-lsm/src/tombstone_elision_tests.rs
          git commit -m "test(lsm): validate Manifest v4 semantic id invariants"
          git push origin HEAD:feat/lsm-tombstone-elision
