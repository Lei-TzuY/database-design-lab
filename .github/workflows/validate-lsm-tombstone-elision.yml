name: Validate LSM tombstone elision

on:
  push:
    branches: [feat/lsm-tombstone-elision]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lsm-tombstone-elision
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply Manifest v4 documentation
        run: python .github/scripts/update_lsm_v4_docs.py
      - name: Validate committed v4 tree
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit validated documentation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/lsm-sstable-manifest-format.md docs/lsm-wal-format.md docs/roadmap.md crates/db-storage-lsm/src/lib.rs
          git commit -m "docs(lsm): specify Manifest v4 durable-empty checkpoints"
          git push origin HEAD:feat/lsm-tombstone-elision
