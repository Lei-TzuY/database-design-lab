name: Validate LSM level compaction slice

on:
  push:
    branches: [feat/lsm-level1-compaction]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lsm-level1-compaction
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply compaction integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_lsm_level1_compaction.py')
          text = p.read_text().replace('pub sstables: usize;', 'pub sstables: usize,')
          p.write_text(text)
          PY
          python .github/scripts/apply_lsm_level1_compaction.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit validated implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-storage-lsm/src/lib.rs crates/db-storage-lsm/src/manifest.rs crates/db-storage-lsm/src/sstable.rs crates/db-storage-lsm/src/compaction_tests.rs
          git commit -m "feat(lsm): add crash-published L0 to L1 compaction"
          git push origin HEAD:feat/lsm-level1-compaction
