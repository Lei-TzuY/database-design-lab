name: Validate LSM level compaction slice

on:
  push:
    branches: [feat/lsm-level1-compaction]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lsm-level1-compaction
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply documentation updates
        run: python .github/scripts/update_lsm_level1_compaction_docs.py
      - name: Validate committed tree
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit validated documentation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/lsm-wal-format.md docs/lsm-sstable-manifest-format.md docs/roadmap.md
          git commit -m "docs(lsm): specify L0 to L1 compaction"
          git push origin HEAD:feat/lsm-level1-compaction
