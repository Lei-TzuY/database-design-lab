name: Validate LSM compaction fault matrix

on:
  push:
    branches: [feat/lsm-compaction-fault-injection]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lsm-compaction-fault-injection
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply fault-matrix integration
        run: python .github/scripts/apply_lsm_compaction_faults.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit validated implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-storage-lsm/src/lib.rs crates/db-storage-lsm/src/manifest.rs crates/db-storage-lsm/src/compaction_fault_tests.rs
          git commit -m "test(lsm): add compaction durable-write fault matrix"
          git push origin HEAD:feat/lsm-compaction-fault-injection
