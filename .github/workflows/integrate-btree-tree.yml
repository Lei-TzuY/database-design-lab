name: Integrate B+ tree module

on:
  push:
    branches: [feat/btree-lookup-insert-splits]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/btree-lookup-insert-splits
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Finalize source and design-space wording
        shell: python
        run: |
          from pathlib import Path

          lib = Path("crates/db-storage-btree/src/lib.rs")
          text = lib.read_text()
          old_docs = '''//! Checksummed fixed-size pages and a bounded read cache for the B+ tree experiment.
//!
//! This crate intentionally stops below the `KvEngine` boundary. It establishes the physical page
//! contract first: two mirrored superblocks define the committed file extent, data pages are fixed
//! 4 KiB slotted pages with whole-page CRC-32 checksums, new pages become committed only after their
//! bytes are synchronized and a newer superblock is synchronized, and the read cache contains only
//! validated immutable page images.
//!
//! There is deliberately no in-place page update API yet. Lookup, insertion, split propagation, and
//! a crash-safe tree mutation protocol belong to the next evidence increment.
'''
          new_docs = '''//! Checksummed copy-on-write B+ tree storage for the database laboratory.
//!
//! The physical layer uses fixed 4 KiB slotted pages, mirrored superblocks, synchronized immutable
//! page allocation, and a bounded cache of validated page images. The tree layer adds binary leaf and
//! internal-cell encodings, point lookup, insertion/update, and root/non-root split propagation.
//!
//! Mutations never overwrite a reachable page: replacement pages are appended and synchronized first,
//! then one mirrored-superblock transition publishes the new root. Deletion, reclamation, ordered
//! scans, overflow values, and the common `KvEngine` capability contract remain deferred.
'''
          if old_docs in text:
              text = text.replace(old_docs, new_docs, 1)
          export = "mod tree;\n\npub use tree::{BPlusTree, MAX_TREE_KEY_BYTES};\n"
          marker = "use thiserror::Error;\n"
          if export not in text:
              if marker not in text:
                  raise SystemExit("lib.rs import marker not found")
              text = text.replace(marker, marker + "\n" + export, 1)
          lib.write_text(text)

          tree = Path("crates/db-storage-btree/src/tree.rs")
          text = tree.read_text().replace(
              "best.map_or(true, |(_, current)| imbalance < current)",
              "best.is_none_or(|(_, current)| imbalance < current)",
          )
          tree.write_text(text)

          design = Path("docs/design-space.md")
          text = design.read_text()
          old_row = "| Binary KV + B+ tree + standalone | Pager/page foundation implemented | `db-storage-btree` now has mirrored superblocks, checksummed 4 KiB slotted pages, bounded validated caching, root metadata commits, and interrupted-allocation recovery; lookup/insert/split and `KvEngine` semantics are not implemented yet |"
          new_row = "| Binary KV + B+ tree + standalone | Point slice implemented, common capability deferred | `db-storage-btree` has mirrored checksummed pages plus copy-on-write binary lookup/insertion, root/non-root splits, root publication, reopen validation, and deterministic split/shadow-page tests; delete, reclamation, ordered scan, overflow values, and common `KvEngine` admission remain deferred |"
          if old_row in text:
              text = text.replace(old_row, new_row, 1)
          old_platform = '''The B+ tree pager likewise provides no cross-process exclusion, and currently
commits only immutable page allocation plus mirrored root/page-count metadata rather than arbitrary
in-place page replacement.'''
          new_platform = '''The B+ tree likewise provides no cross-process exclusion. Its current mutation protocol avoids
in-place replacement entirely: copy-on-write pages are synchronized before a mirrored root-pointer
transition publishes the new tree; unreachable historical pages are not reclaimed yet.'''
          if old_platform in text:
              text = text.replace(old_platform, new_platform, 1)
          design.write_text(text)
      - name: Validate implementation
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit finalization when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-storage-btree/src/lib.rs crates/db-storage-btree/src/tree.rs docs/design-space.md
          git commit -m "docs(btree): align source and capability status"
          git push origin HEAD:feat/btree-lookup-insert-splits
