name: Integrate B+ tree module

on:
  push:
    branches: [feat/btree-lookup-insert-splits]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/btree-lookup-insert-splits
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Export tree API and apply known lint fix
        shell: python
        run: |
          from pathlib import Path

          lib = Path("crates/db-storage-btree/src/lib.rs")
          text = lib.read_text()
          export = "mod tree;\n\npub use tree::{BPlusTree, MAX_TREE_KEY_BYTES};\n"
          marker = "use thiserror::Error;\n"
          if export not in text:
              if marker not in text:
                  raise SystemExit("lib.rs import marker not found")
              text = text.replace(marker, marker + "\n" + export, 1)
              lib.write_text(text)

          tree = Path("crates/db-storage-btree/src/tree.rs")
          text = tree.read_text()
          text = text.replace(
              "best.map_or(true, |(_, current)| imbalance < current)",
              "best.is_none_or(|(_, current)| imbalance < current)",
          )
          tree.write_text(text)
      - name: Validate implementation
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit integration when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-storage-btree/src/lib.rs crates/db-storage-btree/src/tree.rs
          git commit -m "feat(btree): expose copy-on-write tree API"
          git push origin HEAD:feat/btree-lookup-insert-splits
