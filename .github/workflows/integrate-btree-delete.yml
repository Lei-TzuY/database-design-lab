name: Integrate B+ tree deletion

on:
  push:
    branches: [feat/btree-delete-rebalance]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/btree-delete-rebalance
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Wire deletion module
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/db-storage-btree/src/tree.rs")
          text = path.read_text()
          marker = "use super::{\n"
          if "mod delete;\n" not in text:
              pos = text.index(marker)
              text = text[:pos] + "mod delete;\n\n" + text[pos:]
              path.write_text(text)
      - name: Validate implementation
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit integration when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-storage-btree/src/tree.rs crates/db-storage-btree/src/tree/delete.rs
          git commit -m "feat(btree): wire deletion and rebalance path"
          git push origin HEAD:feat/btree-delete-rebalance
