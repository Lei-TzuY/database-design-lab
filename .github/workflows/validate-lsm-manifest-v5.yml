name: Validate LSM Manifest v5

on:
  push:
    branches: [fix/lsm-table-id-high-watermark]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lsm-table-id-high-watermark
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Add tableless Manifest v4 migration proof
        run: python .github/scripts/add_lsm_v5_tableless_migration_test.py
      - name: Validate committed Manifest v5 tree
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit validated migration regression
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-storage-lsm/src/compaction_tests.rs
          git commit -m "test(lsm): prove tableless Manifest v4 allocation migration"
          git push origin HEAD:fix/lsm-table-id-high-watermark
