name: Validate Phase 4 common amplification

on:
  push:
    branches:
      - feat/phase4-common-amplification

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase4-common-amplification
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation patch
        run: |
          python .github/scripts/apply_phase4_common_amplification.py
          python .github/scripts/fix_phase4_common_amplification_tests.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-core/src/engine.rs crates/db-core/src/lib.rs crates/db-storage-lsm/src/lib.rs crates/db-storage-lsm/src/instrumentation_tests.rs crates/db-storage-btree/src/lib.rs crates/db-storage-btree/src/tree.rs crates/db-storage-btree/src/tree/delete.rs crates/db-storage-btree/src/tree/scan.rs crates/db-storage-btree/src/tree/common.rs crates/db-storage-btree/src/tree/instrumentation_tests.rs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "feat: unify amplification evidence across engines"
            git push origin HEAD:feat/phase4-common-amplification
          fi
