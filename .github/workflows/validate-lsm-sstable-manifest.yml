name: Validate LSM SSTable manifest slice

on:
  push:
    branches: [feat/lsm-sstable-manifest]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lsm-sstable-manifest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply staged fixes
        run: python .github/scripts/fix_lsm_sstable_manifest.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit validated implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-storage-lsm/src/lib.rs crates/db-storage-lsm/src/manifest.rs crates/db-storage-lsm/src/memtable.rs crates/db-storage-lsm/src/sstable.rs crates/db-storage-lsm/src/tests.rs
          git commit -m "feat(lsm): validate SSTable manifest foundation"
          git push origin HEAD:feat/lsm-sstable-manifest
