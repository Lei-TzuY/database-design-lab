name: Validate Phase 4 shared experiment traces

on:
  push:
    branches:
      - feat/phase4-shared-experiment-traces
    paths:
      - .github/workflows/validate-phase4-experiment-traces.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase4-shared-experiment-traces
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply mechanical cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/db-core/src/experiment.rs')
          text = path.read_text()
          text = text.replace(
              'AmplificationInstrumented, AmplificationRatio, AmplificationReport, ByteString, DbError,\n    EngineCapabilities, KvEngine, ReadWorkUnit, Result, StructuralReadAmplification, MAX_KEY_BYTES,\n    MAX_VALUE_BYTES,',
              'AmplificationInstrumented, AmplificationReport, ByteString, DbError, EngineCapabilities,\n    KvEngine, Result, MAX_VALUE_BYTES,',
          )
          text = text.replace(
              'AmplificationInstrumented, AmplificationRatio, AmplificationReport, ByteString, DbError,\n    EngineCapabilities, KvEngine, ReadWorkUnit, Result, StructuralReadAmplification, MAX_VALUE_BYTES,',
              'AmplificationInstrumented, AmplificationReport, ByteString, DbError, EngineCapabilities,\n    KvEngine, Result, MAX_VALUE_BYTES,',
          )
          text = text.replace(
              '(u64::from(self.key_space) + 1) / 2',
              'u64::from(self.key_space).div_ceil(2)',
          )
          path.write_text(text)
          PY
      - name: Refresh lockfile
        run: cargo check --workspace
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Commit validated mechanical changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/db-core/src/experiment.rs crates/db-core/src/lib.rs crates/db-cli/Cargo.toml crates/db-cli/src/main.rs
          if git diff --cached --quiet; then
            echo "No mechanical changes to commit"
          else
            git commit -m "chore: validate shared experiment trace implementation"
            git push origin HEAD:feat/phase4-shared-experiment-traces
          fi
