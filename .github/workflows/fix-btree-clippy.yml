name: Fix B+ tree Clippy finding

on:
  push:
    branches: [feat/btree-pager-foundation]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/btree-pager-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Replace double BTreeMap lookup
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/db-storage-btree/src/lib.rs")
          text = path.read_text()
          old = '''        if self.pages.contains_key(&page_id) {
              self.pages.insert(page_id, page);
              self.touch(page_id);
              return;
          }
          if self.pages.len() == self.capacity {
              if let Some(evicted) = self.order.pop_front() {
                  self.pages.remove(&evicted);
              }
          }
          self.pages.insert(page_id, page);
          self.order.push_back(page_id);
          '''
          new = '''        if self.pages.insert(page_id, page).is_some() {
              self.touch(page_id);
              return;
          }
          if self.pages.len() > self.capacity {
              if let Some(evicted) = self.order.pop_front() {
                  self.pages.remove(&evicted);
              }
          }
          self.order.push_back(page_id);
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("expected PageCache::insert block not found")
      - name: Format and validate Clippy
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Commit fix when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-storage-btree/src/lib.rs
          git commit -m "fix(btree): avoid duplicate cache lookup"
          git push origin HEAD:feat/btree-pager-foundation
