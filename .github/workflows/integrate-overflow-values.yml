name: Integrate B+ tree overflow values

on:
  push:
    branches: [feat/btree-overflow-values]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/btree-overflow-values
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Align overflow documentation
        run: python .github/scripts/update_overflow_docs.py
      - name: Validate implementation
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit integration when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md crates/db-storage-btree/src/lib.rs crates/db-storage-btree/src/tree.rs docs/btree-page-format.md docs/design-space.md docs/roadmap.md
          git commit -m "docs(btree): specify overflow value chains"
          git push origin HEAD:feat/btree-overflow-values
