name: Integrate B+ tree overflow values

on:
  push:
    branches: [feat/btree-overflow-values]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/btree-overflow-values
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Wire overflow value representation
        run: python .github/scripts/integrate_overflow_values.py
      - name: Validate implementation
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit integration when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-storage-btree/src/lib.rs crates/db-storage-btree/src/tree.rs crates/db-storage-btree/src/tree/delete.rs crates/db-storage-btree/src/tree/reuse.rs crates/db-storage-btree/src/tree/overflow.rs
          git commit -m "feat(btree): wire crash-safe overflow values"
          git push origin HEAD:feat/btree-overflow-values
