name: Validate Phase 4 counterbalanced attempts

on:
  push:
    branches:
      - staging/phase4-counterbalanced-attempts
    paths:
      - .github/scripts/apply_phase4_counterbalanced_attempts.py
      - .github/scripts/fix_phase4_counterbalanced_attempts.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/phase4-counterbalanced-attempts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply product patch
        run: |
          python .github/scripts/apply_phase4_counterbalanced_attempts.py
          python .github/scripts/fix_phase4_counterbalanced_attempts.py
      - name: Format
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - name: Check minimum Rust
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Commit validated product tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-core/src/engine.rs crates/db-core/src/experiment.rs crates/db-core/src/lib.rs crates/db-storage-btree/src/tree/common.rs crates/db-storage-lsm/src/lib.rs crates/db-cli/src/main.rs
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "feat: retain counterbalanced experiment attempts"
            git push origin HEAD:staging/phase4-counterbalanced-attempts
          fi