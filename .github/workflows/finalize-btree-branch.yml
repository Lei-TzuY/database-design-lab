name: Finalize B+ tree branch

on:
  push:
    branches: [feat/btree-lookup-insert-splits]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/btree-lookup-insert-splits
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Patch final wording
        shell: python
        run: |
          from pathlib import Path
          lib = Path("crates/db-storage-btree/src/lib.rs")
          text = lib.read_text()
          start = text.index("//! Checksummed fixed-size pages")
          end = text.index("\n\nuse std::collections", start)
          docs = "//! Checksummed copy-on-write B+ tree storage for the database laboratory.\n//!\n//! Fixed 4 KiB slotted pages, mirrored superblocks, synchronized immutable allocation, and a bounded\n//! validated-page cache form the physical layer. The tree layer adds binary point lookup, insertion/\n//! update, and root/non-root split propagation. Mutations append replacement pages before atomically\n//! publishing a new root; deletion, reclamation, ordered scans, overflow values, and common `KvEngine`\n//! admission remain deferred."
          text = text[:start] + docs + text[end:]
          lib.write_text(text)

          design = Path("docs/design-space.md")
          text = design.read_text()
          text = text.replace(
              "| Binary KV + B+ tree + standalone | Pager/page foundation implemented | `db-storage-btree` now has mirrored superblocks, checksummed 4 KiB slotted pages, bounded validated caching, root metadata commits, and interrupted-allocation recovery; lookup/insert/split and `KvEngine` semantics are not implemented yet |",
              "| Binary KV + B+ tree + standalone | Point slice implemented, common capability deferred | `db-storage-btree` has mirrored checksummed pages plus copy-on-write binary lookup/insertion, root/non-root splits, root publication, reopen validation, and deterministic split/shadow-page tests; delete, reclamation, ordered scan, overflow values, and common `KvEngine` admission remain deferred |",
          )
          text = text.replace(
              "The B+ tree pager likewise provides no cross-process exclusion, and currently\ncommits only immutable page allocation plus mirrored root/page-count metadata rather than arbitrary\nin-place page replacement.",
              "The B+ tree likewise provides no cross-process exclusion. Its current mutation protocol avoids\nin-place replacement entirely: copy-on-write pages are synchronized before a mirrored root-pointer\ntransition publishes the new tree; unreachable historical pages are not reclaimed yet.",
          )
          design.write_text(text)
      - name: Validate feature
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit final wording
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db-storage-btree/src/lib.rs crates/db-storage-btree/src/tree.rs docs/design-space.md
          git commit -m "docs(btree): align source and capability status"
          git push origin HEAD:feat/btree-lookup-insert-splits
