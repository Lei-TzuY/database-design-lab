name: Integrate B+ tree ordered range scan

on:
  push:
    branches: [feat/btree-ordered-range-scan]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/btree-ordered-range-scan
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply range scan integration
        run: |
          if [ ! -f crates/db-storage-btree/src/tree/scan.rs ]; then
            python .github/scripts/integrate_range_scan.py
            python .github/scripts/fix_range_scan.py
          fi
          if grep -q 'ordered scans remain a separate capability' README.md; then
            python .github/scripts/update_range_docs.py
          fi
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md crates/db-core/src/engine.rs crates/db-core/src/lib.rs crates/db-storage-memory/src/lib.rs crates/db-storage-btree/src/lib.rs crates/db-storage-btree/src/tree.rs crates/db-storage-btree/src/tree/scan.rs crates/db-storage-btree/src/tree/common.rs docs/btree-page-format.md docs/design-space.md docs/experimental-constitution.md docs/roadmap.md
          git commit -m "feat(btree): document common ordered range scans"
          git push origin HEAD:feat/btree-ordered-range-scan
