name: Validate LSM WAL rotation slice

on:
  push:
    branches: [feat/lsm-wal-rotation]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lsm-wal-rotation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply documentation updates
        run: python .github/scripts/update_lsm_wal_rotation_docs.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit validated docs and formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md docs/lsm-wal-format.md docs/lsm-sstable-manifest-format.md crates/db-storage-lsm/src/wal_rotation_tests.rs
          git commit -m "docs(lsm): specify WAL rotation and reclamation"
          git push origin HEAD:feat/lsm-wal-rotation
