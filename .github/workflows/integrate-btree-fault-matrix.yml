name: Integrate B+ tree mutation fault matrix

on:
  push:
    branches: [feat/btree-mutation-fault-matrix]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/btree-mutation-fault-matrix
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply mutation fault integration and docs
        run: |
          if ! grep -q 'enum DurableWriteKind' crates/db-storage-btree/src/lib.rs; then
            python .github/scripts/integrate_btree_fault_matrix.py
            python .github/scripts/fix_btree_fault_matrix.py
          fi
          python .github/scripts/update_btree_fault_docs.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md crates/db-storage-btree/src/lib.rs crates/db-storage-btree/src/tree.rs crates/db-storage-btree/src/tree/reuse.rs crates/db-storage-btree/src/tree/fault.rs docs/btree-page-format.md docs/design-space.md docs/experimental-constitution.md docs/roadmap.md
          git commit -m "docs(btree): record mutation fault evidence"
          git push origin HEAD:feat/btree-mutation-fault-matrix
