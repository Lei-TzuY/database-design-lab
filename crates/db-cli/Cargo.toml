[package]
name = "db-cli"
description = "Command-line harness for Database Design Lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "db-lab"
path = "src/main.rs"

[[bin]]
name = "db-lab-batch"
path = "src/bin/db-lab-batch.rs"

[[bin]]
name = "db-lab-batch-verify"
path = "src/bin/db-lab-batch-verify.rs"

[[bin]]
name = "db-lab-batch-analyze"
path = "src/bin/db-lab-batch-analyze.rs"

[[bin]]
name = "db-lab-batch-analysis-bundle"
path = "src/bin/db-lab-batch-analysis-bundle.rs"

[[bin]]
name = "db-lab-host-preflight"
path = "src/bin/db-lab-host-preflight.rs"

[[bin]]
name = "db-lab-host-preflight-verify"
path = "src/bin/db-lab-host-preflight-verify.rs"

[[bin]]
name = "db-lab-shrink"
path = "src/bin/db-lab-shrink.rs"

[dependencies]
clap.workspace = true
db-core = { path = "../db-core" }
db-storage-btree = { path = "../db-storage-btree" }
db-storage-lsm = { path = "../db-storage-lsm" }
db-storage-log = { path = "../db-storage-log" }
db-storage-memory = { path = "../db-storage-memory" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[lints]
workspace = true
